<main class="review-page">
  <aside class="review-page__nav">
    <app-page-nav
      [pageCount]="pageCount()"
      [currentPageIndex]="pageIndex()"
      [confidenceMap]="confidenceMap()"
      [editCountMap]="editCountMap()"
      [draftPageMap]="draftPageMap()"
      (pageSelected)="selectPage($event)" />
  </aside>
  <section class="review-page__main">
    <header class="toolbar">
      <a routerLink="/">Back</a>
      <strong>Page {{ pageIndex() + 1 }} of {{ pageCount() }}</strong>
      <span *ngIf="page()">Confidence: {{ page()!.confidence.toFixed(2) }}</span>
      <span>Edits this page: {{ editCountMap()[pageIndex()] ?? 0 }}</span>
      <span>Total session edits: {{ editSummary()?.totalEdits ?? 0 }}</span>
      <button type="button" (click)="previousPage()" [disabled]="pageIndex() === 0">Previous</button>
      <button type="button" (click)="nextPage()" [disabled]="pageIndex() >= pageCount() - 1">Next</button>
    </header>

    <section class="single-view">
      <div #editorViewport class="surface surface--single" *ngIf="page() as currentPage">
        <div class="fit-box" [style.width.px]="scaledWidth()" [style.height.px]="scaledHeight()">
          <iframe
            class="html-preview"
            [src]="finalHtmlUrl()"
            [style.width.px]="currentPage.pageWidth"
            [style.height.px]="currentPage.pageHeight"
            [style.transform]="transform()"
            sandbox="allow-same-origin"></iframe>
        </div>
      </div>
    </section>

    <p *ngIf="loading()">{{ loading() }}</p>
  </section>
</main>
