<main class="upload-page">
  <section class="panel">
    <h1>PDF Review Workbench</h1>
    <label><input type="checkbox" [checked]="useLocalPath()" (change)="useLocalPath.set(!useLocalPath())"> Use local path</label>
    <div *ngIf="!useLocalPath(); else pathMode" class="drop-zone">
      <input type="file" accept="application/pdf" (change)="onFileSelected($event)">
      <p>{{ selectedFile()?.name ?? 'Drop PDF here or click to browse' }}</p>
    </div>
    <ng-template #pathMode>
      <input type="text" [ngModel]="localPath()" (ngModelChange)="localPath.set($event)" placeholder="E:\\docs\\file.pdf">
    </ng-template>
    <button type="button" (click)="submit()">Start Extraction</button>
    <p>{{ status() }}</p>
    <p>{{ progress() }}</p>
    <p class="error" *ngIf="error()">{{ error() }}</p>
  </section>
</main>
