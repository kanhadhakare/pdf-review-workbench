<main class="review-page">
  <aside class="review-page__nav">
    <app-page-nav [pageCount]="pageCount()" [currentPageIndex]="pageIndex()" [confidenceMap]="confidenceMap()" [editCountMap]="editCountMap()" (pageSelected)="selectPage($event)" />
  </aside>
  <section class="review-page__main">
    <header class="toolbar">
      <a routerLink="/">Back</a>
      <strong>Page {{ pageIndex() + 1 }} of {{ pageCount() }}</strong>
      <span *ngIf="page()">Confidence: {{ page()!.confidence.toFixed(2) }}</span>
      <span>Edits this page: {{ editCountMap()[pageIndex()] ?? 0 }}</span>
      <span>Total session edits: {{ editSummary()?.totalEdits ?? 0 }}</span>
      <span>Pending fixes: {{ pendingSummary().total }}</span>
      <button type="button" (click)="editMode.set(!editMode())">{{ editMode() ? 'Exit Edit' : 'Edit' }}</button>
      <button type="button" (click)="previousPage()" [disabled]="pageIndex() === 0">Previous</button>
      <button type="button" (click)="nextPage()" [disabled]="pageIndex() >= pageCount() - 1">Next</button>
    </header>
    <app-split-view>
      <div leftPane class="pane">
        <div #imageViewport class="surface" *ngIf="page() as currentPage">
          <div class="fit-box" [style.width.px]="scaledWidth()" [style.height.px]="scaledHeight()">
            <img [src]="currentPage.imageUrl" [style.width.px]="currentPage.pageWidth" [style.height.px]="currentPage.pageHeight" [style.transform]="transform()">
          </div>
        </div>
      </div>
      <div rightPane class="pane">
        <div #editorViewport class="surface" *ngIf="page() as currentPage">
          <div class="fit-box" [style.width.px]="scaledWidth()" [style.height.px]="scaledHeight()">
            <app-fix-editor
              [jobId]="jobId()"
              [page]="currentPage"
              [editMode]="editMode()"
              [scale]="pageScale()"
              (pendingChanged)="updatePending($event)"
              (fixesSaved)="handleFixesSaved($event)" />
          </div>
        </div>
      </div>
    </app-split-view>
    <p *ngIf="loading()">{{ loading() }}</p>
  </section>
</main>
