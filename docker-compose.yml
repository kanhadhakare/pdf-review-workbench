services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:8080"
      STORAGE_ROOT: "/app/storage"
      WORKBENCH_ROOT: "/app"
      BACKEND_ROOT: "/app/backend"
      JAVA_BIN: "/usr/bin/java"
      PYTHON_BIN: "/usr/bin/python3"
      PDF_ALLOWED_ROOTS: "/app/storage/uploads:/data/pdfs"
    volumes:
      # Must be a host *directory* (not a file). Run compose from the repo root (E:\\pdf-review-workbench).
      - ./storage:/app/storage
      - ./sample-pdfs:/data/pdfs
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
