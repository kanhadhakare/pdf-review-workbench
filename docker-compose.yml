services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:8080"
      STORAGE_ROOT: "/app/storage"
      WORKBENCH_ROOT: "/app"
      BACKEND_ROOT: "/app/backend"
      JAVA_BIN: "/usr/bin/java"
      PYTHON_BIN: "/usr/bin/python3"
      PDF_ALLOWED_ROOTS: "/app/storage/uploads:/data/pdfs"
      PDF2HTMLEX_ENABLE: "1"
      PDF2HTMLEX_MODE: "remote"
      PDF2HTMLEX_REMOTE_URL: "http://pdf2htmlex-runner:4010/run"
    volumes:
      - ./storage:/app/storage
      - ./sample-pdfs:/data/pdfs
    ports:
      - "3000:3000"

  pdf2htmlex-runner:
    build:
      context: ./pdf2htmlex-runner
    environment:
      PORT: "4010"
      JOBS_ROOT: "/jobs"
    volumes:
      - ./storage/jobs:/jobs

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
      - pdf2htmlex-runner
    ports:
      - "8080:80"
